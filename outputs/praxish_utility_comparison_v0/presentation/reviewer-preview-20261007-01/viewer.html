<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPC 活动轨迹｜开发检视</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; background: #f3f6f8; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1120px; margin: auto; }
    h1 { margin: 0 0 6px; font-size: 1.55rem; }
    .notice { color: #536271; margin: 0 0 18px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px; background: white; border: 1px solid #dce3e9; border-radius: 12px; }
    button, select { font: inherit; border: 1px solid #bdc9d3; border-radius: 8px; background: #fff; padding: 8px 12px; color: inherit; }
    button { cursor: pointer; } button:disabled { opacity: .45; cursor: default; }
    #position { min-width: 130px; text-align: center; color: #536271; }
    #disclosure { min-height: 1.5em; margin: 8px 2px 14px; color: #715114; }
    .panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .pane { background: white; border: 1px solid #dce3e9; border-radius: 12px; padding: 16px; min-width: 0; }
    .pane h2 { font-size: 1.15rem; margin: 0 0 4px; }
    .actor { color: #536271; margin-bottom: 14px; }
    .action { font-size: 1.05rem; font-weight: 650; padding: 9px 11px; border-radius: 8px; background: #eaf3fb; margin-bottom: 12px; }
    .section-label { text-transform: none; letter-spacing: .02em; color: #63717e; font-size: .82rem; margin: 11px 0 6px; }
    .cards { display: flex; flex-wrap: wrap; gap: 7px; }
    .card { border: 1px solid #dce3e9; border-radius: 8px; padding: 7px 9px; background: #fbfcfd; font-size: .9rem; }
    .events { display: grid; gap: 7px; }
    .event { padding: 8px 10px; border-left: 3px solid #c58b28; background: #fff8e8; border-radius: 4px; font-size: .9rem; }
    .empty { color: #7b8792; font-style: italic; }
    .turn { border-top: 1px solid #e3e8ec; margin-top: 13px; padding-top: 10px; }
    @media (max-width: 760px) { body { padding: 12px; } .panes { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>NPC 活动轨迹</h1>
  <p class="notice">DEVELOPMENT 离线检视：只展示记录中的动作与三类公开状态，不含目标、评分或内部解释。可揭示来源；这不是盲测或玩家招募界面。</p>
  <div class="toolbar">
    <label for="scene">场景</label><select id="scene"></select>
    <button id="prev" type="button">上一步</button><button id="play" type="button">播放</button><button id="next" type="button">下一步</button>
    <span id="position" aria-live="polite"></span>
    <button id="reveal" type="button" aria-pressed="false">揭示来源（开发检视）</button>
  </div>
  <div id="disclosure" aria-live="polite"></div>
  <section class="panes" aria-label="同一回合的两个匿名轨迹">
    <article id="paneA" class="pane"></article><article id="paneB" class="pane"></article>
  </section>
</main>
