name: runtime-regression

on:
  push:
    branches: [webgpt-sync]
  pull_request:

jobs:
  praxish-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and verify pinned AIIDE 2023 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "02_实验/Praxish_Activity_Pilot_v0/tools/pilot.mjs" fetch
      - name: Original artifact and activity pilot contracts
        run: node "02_实验/Praxish_Activity_Pilot_v0/tools/pilot.mjs" test
      - name: Independent utility comparison contracts
        run: node "02_实验/Praxish_Utility_Comparison_v0/tools/compare.mjs" test
      - name: Fresh matched comparison
        run: node "02_实验/Praxish_Utility_Comparison_v0/tools/compare.mjs" run --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve comparison evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praxish-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/praxish_utility_comparison_v0/runs/
          if-no-files-found: ignore
          retention-days: 7
  source-ranking-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic-test dependencies
        run: |
          python -m pip install numpy==2.5.3
          python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Source-ranking synthetic contracts only
        run: |
          python 02_实验/LIGHT_SourceRankingV1/test_train.py
          python 02_实验/LIGHT_SourceRankingV1/test_project_inputs.py
          python 02_实验/LIGHT_SourceRankingV1/test_execution_admission.py

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S "Demo codex-generated" -B build -G Ninja
      - name: Build
        run: cmake --build build --parallel
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Reference verification
        run: ./build/character_dynamics_reference --verify
      - name: LIGHT audit contract tests
        run: |
          python3 tools/test_audit_light_prediction_admission_v1.py
          python3 tools/audit_light_source_lineage_v1.py --self-test
          python3 tools/test_build_light_before_turn_v1.py
          python3 tools/test_audit_light_snapshot_timing_v1.py
          python3 02_实验/LIGHT_SourceRankingV1/test_project_inputs.py
      - name: Repository health
        run: python3 tools/repo_health_check.py
