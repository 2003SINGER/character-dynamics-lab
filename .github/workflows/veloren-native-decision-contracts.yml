name: veloren-native-decision-contracts

on:
  push:
    branches: [webgpt-sync]
    paths:
      - 'tools/veloren_native_decision_v1/**'
      - 'tools/veloren_native_v0/**'
      - '.github/workflows/veloren-native-decision-contracts.yml'

jobs:
  offline-python-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned HTN dependency for offline contracts
        run: python -m pip install gtpyhop-core==2.0.2
      - name: Native decision v1 Python contracts (offline; no game, Rust build, or server)
        run: python -B -m unittest tools.veloren_native_decision_v1.tests.test_adapter tools.veloren_native_decision_v1.tests.test_runner_contract -v
      - name: Native Talk file contracts (offline; standard library, no game, Rust build, or server)
        working-directory: tools/veloren_native_v0
        run: python -B -m unittest test_native_talk test_run_talk_probe -v
