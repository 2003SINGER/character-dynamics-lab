name: npc-system-development

on:
  push:
    branches: [webgpt-sync]
    paths:
      - 'tools/npc_system_v0/**'
      - 'tools/e1_keyledger_v0/**'
      - 'tools/e0_keyledger_v0/**'
      - 'tools/trajectory_constraints_v0/**'
      - '.github/workflows/npc-system-development.yml'
  pull_request:
    paths:
      - 'tools/npc_system_v0/**'
      - '.github/workflows/npc-system-development.yml'

jobs:
  bounded-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/npc_system_v0/requirements.txt
      - name: Application and unchanged Python baselines
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tools
        run: |
          set -o pipefail
          mkdir -p runs/npc-system-v0/ci
          python -B -m unittest discover -s tools/npc_system_v0/tests -v 2>&1 | tee runs/npc-system-v0/ci/unit.log
          python -B -m unittest discover -s tools/e1_keyledger_v0/tests -v
          python -B -m unittest discover -s tools/e0_keyledger_v0/tests -v
          python -B -m unittest discover -s tools/trajectory_constraints_v0/tests -v
      - name: Retain development matrix, including failures
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tools
        run: python -B -m tools.npc_system_v0.runner --suite --out runs/npc-system-v0/ci/matrix
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/npc-system-v0/ci/
          if-no-files-found: ignore
          retention-days: 30
